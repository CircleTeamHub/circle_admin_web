server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker 内嵌 DNS。配合下面变量式 proxy_pass,nginx 每次请求都重新解析后端,
  # 而不是启动时解析一次把容器 IP 钉死 —— 否则 circle_be 重建/蓝绿切换后,
  # 这里会一直反代到已消失的旧 IP。
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    # circle-be-app 是 circle_be 蓝绿两色共享的网络别名
    # (circle_be 仓库 docker-compose.prod.yml);哪个颜色在服务都能解析到。
    # 变量形式是刻意的:nginx 只对变量 upstream 走运行时 resolver。
    set $circle_be_upstream http://circle-be-app:3000;
    proxy_pass $circle_be_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
