# Promote a tested main image to a version tag, then deploy its immutable
# digest. Manual dispatch is read-only in GHCR and only redeploys an existing
# version image.
name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to redeploy or roll back to"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: "Resolve immutable release image"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      sha_image: ${{ steps.image.outputs.sha_image }}
      release_image: ${{ steps.image.outputs.release_image }}
      digest: ${{ steps.image.outputs.digest }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      needs_promotion: ${{ steps.image.outputs.needs_promotion }}
    steps:
      - name: Determine release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag commit is on main
        id: verify
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Tag ${{ steps.tag.outputs.tag }} ($SHA) is not an ancestor of origin/main." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve registry manifest
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha_image="$repo:sha-$SHA"
          release_image="$repo:$RELEASE_TAG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! digest="$(digest_of "$release_image")"; then
              echo "Existing release image not found: $release_image" >&2
              exit 1
            fi
            needs_promotion=false
          else
            if ! digest="$(digest_of "$sha_image")"; then
              echo "Prebuilt main image not found: $sha_image" >&2
              echo "Wait for the Build Image workflow to pass before releasing." >&2
              exit 1
            fi
            if existing_digest="$(digest_of "$release_image" 2>/dev/null)"; then
              if [ "$existing_digest" != "$digest" ]; then
                echo "Refusing to overwrite $release_image ($existing_digest != $digest)." >&2
                exit 1
              fi
              needs_promotion=false
            else
              needs_promotion=true
            fi
          fi

          {
            echo "sha_image=$sha_image"
            echo "release_image=$release_image"
            echo "digest=$digest"
            echo "image_ref=$repo@$digest"
            echo "needs_promotion=$needs_promotion"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: "Promote main image to version tag"
    runs-on: ubuntu-latest
    needs: [resolve]
    if: ${{ needs.resolve.outputs.needs_promotion == 'true' }}
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote and verify manifest
        env:
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.digest }}
          RELEASE_IMAGE: ${{ needs.resolve.outputs.release_image }}
          SHA_IMAGE: ${{ needs.resolve.outputs.sha_image }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$RELEASE_IMAGE" "$SHA_IMAGE"
          actual="$(docker buildx imagetools inspect "$RELEASE_IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')"
          if [ "$actual" != "$EXPECTED_DIGEST" ]; then
            echo "Promoted digest mismatch: $actual != $EXPECTED_DIGEST" >&2
            exit 1
          fi

  deploy:
    name: "Deploy to server"
    runs-on: ubuntu-latest
    needs: [resolve, promote]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "Missing DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, and/or DEPLOY_HOST." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Roll out admin_web on server
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          ADMIN_WEB_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'circle_be' }}
        run: |
          set -euo pipefail
          {
            printf 'export RELEASE_TAG=%q ADMIN_WEB_IMAGE=%q GHCR_USER=%q GHCR_TOKEN=%q\n' \
              "$RELEASE_TAG" "$ADMIN_WEB_IMAGE" "$GHCR_USER" "$GHCR_TOKEN"
            printf 'exec bash %q/deploy/admin-web-deploy.sh\n' "$DEPLOY_PATH"
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s

      - name: External smoke check
        env:
          ADMIN_SMOKE_URL: ${{ vars.ADMIN_SMOKE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_SMOKE_URL" ]; then
            echo "vars.ADMIN_SMOKE_URL not set; server-side smoke check completed."
            exit 0
          fi
          for _ in 1 2 3 4 5 6; do
            code="$(curl -m 10 -s -o /dev/null -w '%{http_code}' "$ADMIN_SMOKE_URL" || echo 000)"
            case "$code" in
              2*|3*) echo "external smoke ok (HTTP $code)"; exit 0 ;;
            esac
            sleep 5
          done
          echo "external smoke failed (last HTTP $code)" >&2
          exit 1

  publish_release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Release ${{ needs.resolve.outputs.tag }}"
          generate_release_notes: true

  notify:
    name: "Notify Discord"
    runs-on: ubuntu-latest
    needs: [resolve, promote, deploy, publish_release]
    if: always()
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Send Discord notification
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag || inputs.tag || github.ref_name }}
          IMAGE_REF: ${{ needs.resolve.outputs.image_ref }}
        run: |
          node <<'NODE' > payload.json
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failed = Object.values(needs).some((job) =>
            ['failure', 'cancelled'].includes(job.result),
          );
          const repo = process.env.GITHUB_REPOSITORY;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const content = [
            `${failed ? ':rotating_light:' : ':rocket:'} **Admin web release ${process.env.RELEASE_TAG} ${failed ? 'failed' : 'deployed'}**`,
            `**Image:** ${process.env.IMAGE_REF || '(not resolved)'}`,
            `**Run:** ${runUrl}`,
          ].join('\n');
          process.stdout.write(JSON.stringify({ username: 'GitHub Actions', content }));
          NODE
          curl --fail-with-body -H 'Content-Type: application/json' -d @payload.json "$DISCORD_WEBHOOK_URL"
